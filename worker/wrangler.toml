# modpack-release Worker —— 由线上部署反推生成（2026-09-06）
# 来源：Cloudflare API /accounts/93fe0753b1dce058535acb744bb78794/workers/scripts/modpack-release
# 注意：线上部分变量以明文形式存在（含密钥），本文件只保留非敏感项，
#       敏感值请通过 `wrangler secret put <NAME>` 注入，不要写进文件。

name = "modpack-release"
main = "src/index.js"
compatibility_date = "2025-08-01"

# 静态资源（index.html / error-report.html 等）
[assets]
directory = "./public"
binding = "ASSETS"

# Cron 触发器：从每分钟降到每 5 分钟。
# 崩溃报告晚 5 分钟出结果完全可接受，换来的是 cron 相关写入直接降到 1/5。
[triggers]
crons = ["*/5 * * * *"]

